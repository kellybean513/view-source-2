<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dare to Struggle, Dare to Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap" rel="stylesheet">
<style>
  body {
    background-color: white;
    font-family: Helvetica, Arial, sans-serif;
    color: black;
  }

  div {
    font-size: 45px;
  }


  h1 {
  color: black;
  font-family: 'Protest Revolution', sans-serif;
  font-size: 90px;
  margin: 0px;
  
  }

  h1 span {
    display: inline-block;
    transform: rotate(15deg);
  }
      
  a:visited, a:link{
    text-decoration: none;
    color: red;
  }

  
  a:hover {
    color: red;
     }

    .cascade-animation span {
            display: inline-block;
            opacity: 0;
            transform: translateY(-20px);
            font-family: sans-serif;
            font-size: 32px;
            animation: fadeInDown 0.5s forwards;
        }

.cascade-animation span:nth-child(1) { animation-delay: 0.1s; }
        .cascade-animation span:nth-child(2) { animation-delay: 0.2s; }
        .cascade-animation span:nth-child(3) { animation-delay: 0.3s; }
        .cascade-animation span:nth-child(4) { animation-delay: 0.4s; }
        .cascade-animation span:nth-child(5) { animation-delay: 0.5s; }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
</style>
</head>

<body>
  <div class="cascade-animation">
    <span>DARE</span>
    <span>DARE</span>
    <span>DARE</span>
    <span>DARE</span>
    <span>DARE</span>
    <span>DARE</span>
    <span>DARE</span>
  </div>

  <h1>

      <span style="transform: rotate(-12deg);">S</span><span>T</span><span style="transform: rotate(-12deg);">R</span><span>U</span><span style="transform: rotate(-12deg);">G</span><span>G</span><span style="transform: rotate(-12deg);">L</span><span>E</span>
  </h1>

    <span style="transform: rotate(-12deg);">T</span><span>O</span> 
    <span style="transform: rotate(-12deg);">W</span><span>I</span><span style="transform: rotate(-12deg);">N</span></a></h1>
